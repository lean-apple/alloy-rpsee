[package]
name = "alloy-rpc-server"
description = "JSON-RPC 2.0 server built on Alloy"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-json-rpc.workspace = true
alloy-primitives.workspace = true
futures-util.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

# server
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, features = ["http1", "http2", "server"], optional = true }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "service", "tokio"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"], optional = true }

[dev-dependencies]
alloy-rpc-macros.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
test-case.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tower.workspace = true

[[test]]
name = "http"
required-features = ["server"]

[[test]]
name = "ws"
required-features = ["server"]

[[example]]
name = "node_server"
required-features = ["server"]

[features]
default = ["server"]
server = [
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio-tungstenite",
    "dep:tower",
    "futures-util/sink",
    "tokio/net",
    "tokio-util/rt",
]
