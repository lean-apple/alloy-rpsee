[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lean-apple/alloy-rpsee"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
use_self = "warn"
redundant_clone = "warn"

[workspace.dependencies]
alloy-json-rpc = { version = "2.5.0", default-features = false }
alloy-primitives = { version = "1.7", default-features = false, features = ["map"] }
alloy-rpc-server = { version = "0.1.0", path = "crates/rpc-server" }
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = { version = "1", default-features = false }
http-body = { version = "1", default-features = false }
http-body-util = { version = "0.1.2", default-features = false }
hyper = { version = "1.9", default-features = false }
hyper-util = { version = "0.1.5", default-features = false }
proc-macro2 = { version = "1", default-features = false, features = ["proc-macro"] }
quote = { version = "1", default-features = false, features = ["proc-macro"] }
rand = { version = "0.9", default-features = false, features = ["alloc", "thread_rng"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["raw_value", "std"] }
syn = { version = "2", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "proc-macro", "visit"] }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tower = { version = "0.5", default-features = false }
tracing = { version = "0.1", default-features = false }

test-case = { version = "3", default-features = false }
trybuild = { version = "1", default-features = false }
