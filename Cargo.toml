[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lean-apple/alloy-rpsee"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
use_self = "warn"
redundant_clone = "warn"

[workspace.dependencies]
alloy-json-rpc = { version = "2.5.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["raw_value", "std"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

test-case = { version = "3", default-features = false }
